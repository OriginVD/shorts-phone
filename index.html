<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E13">
<title>쇼츠 플레이어</title>
<style>
  :root {
    --bg: #0E0E13; --side: #16161D; --card: #21212B; --card-hi: #2D2D3A;
    --text: #EDEDF2; --dim: #8A8A9A; --accent: #FF3D7F; --accent-hi: #FF6699;
    --tik: #25F4EE; --yt: #FF3B3B; --dark: #101014;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    font-size: 15px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 4px 2px 2px; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 2px 12px; display: flex; align-items: center; gap: 8px; }
  .sub::before { content: ''; width: 28px; height: 4px; background: var(--accent); border-radius: 2px; }

  button {
    font: inherit; color: var(--text); background: var(--card); border: 0;
    border-radius: 10px; height: 44px; padding: 0 12px; cursor: pointer; white-space: nowrap;
  }
  button:active { background: var(--card-hi); }
  button.main { background: var(--accent); color: #fff; font-weight: bold; }
  button.main:active { background: var(--accent-hi); }
  button.toggle { color: var(--dim); padding: 0 6px; font-size: 14px; }
  button.toggle.on { background: var(--accent); color: #fff; }
  button:disabled { color: var(--dim); background: var(--card); }

  #stage {
    position: relative; background: #000; border-radius: 12px; overflow: hidden;
    height: 58vh; display: flex; align-items: center; justify-content: center;
  }
  video { width: 100%; height: 100%; object-fit: contain; display: none; }
  #placeholder { color: #4A4A58; font-weight: bold; text-align: center; line-height: 2; }
  #stage.playing video { display: block; }
  #stage.playing #placeholder { display: none; }

  .now { background: var(--card); border-radius: 12px; padding: 8px 14px; margin: 10px 0; }
  .now-head { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  #loopInfo { color: var(--accent); }
  #nowTitle { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .row > .grow { flex: 1; }
  .count { display: flex; align-items: center; gap: 4px; }
  .count button { width: 36px; padding: 0; font-weight: bold; }
  #countVal { width: 30px; text-align: center; font-size: 18px; font-weight: bold; }
  .label { color: var(--text); white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #volVal { color: var(--dim); font-size: 12px; width: 40px; }

  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 6px; }
  .list-head b { font-size: 16px; }
  .list-head span { color: var(--dim); font-size: 12px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li {
    display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px;
    cursor: pointer; position: relative;
  }
  #list li.playing { background: var(--card); }
  #list li.playing::before {
    content: ''; position: absolute; left: 3px; top: 12px; bottom: 12px; width: 4px;
    border-radius: 2px; background: var(--accent);
  }
  #list li.playing .t { color: var(--accent-hi); }
  .badge {
    flex: none; width: 58px; height: 20px; border-radius: 6px; font-size: 10px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; background: var(--dim); color: #fff;
  }
  .badge.TikTok { background: var(--tik); color: var(--dark); }
  .badge.YouTube { background: var(--yt); }
  .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { color: var(--dim); font-size: 12px; min-height: 16px; margin: 2px 2px 8px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1>쇼츠 플레이어</h1>
  <div class="sub">핸드폰에 넣은 쇼츠 반복해서 보기</div>

  <div id="stage">
    <video id="video" playsinline preload="auto"></video>
    <div id="placeholder">▶<br>아래 [영상 고르기]로<br>핸드폰에 있는 영상을 골라 주세요</div>
  </div>

  <div class="now">
    <div class="now-head"><span>지금 재생</span><span id="loopInfo"></span></div>
    <div id="nowTitle">—</div>
  </div>

  <div class="row">
    <button class="main grow" id="btnPlay">▶ 재생</button>
    <button class="grow" id="btnStop">■ 정지</button>
    <button class="grow" id="btnNext">⏭ 다음</button>
  </div>

  <div class="row">
    <span class="label">한 개당</span>
    <div class="count">
      <button id="btnMinus">−</button>
      <span id="countVal">3</span>
      <button id="btnPlus">+</button>
    </div>
    <span class="label">번씩</span>
    <button class="toggle grow" id="tglShuffle">⇄ 섞기</button>
    <button class="toggle grow" id="tglLoopAll">↻ 무한</button>
  </div>

  <div class="row">
    <span class="label">볼륨</span>
    <input type="range" id="vol" min="0" max="100" step="5">
    <span id="volVal"></span>
  </div>

  <div class="row">
    <button class="grow" id="btnPick">영상 고르기</button>
  </div>
  <input type="file" id="picker" accept="video/*,.mp4,.webm,.mkv,.mov" multiple>
  <div id="status"></div>

  <div class="list-head"><b>내 쇼츠</b><span id="listCount">0개</span></div>
  <ul id="list"></ul>

<script>
const MAX_COUNT = 20;
const $ = id => document.getElementById(id);
const video = $('video');

// 설정 (count 0 = 무한)
const cfg = Object.assign({ count: 3, shuffle: false, loopAll: false, volume: 100 },
  JSON.parse(localStorage.getItem('shorts-cfg') || '{}'));
const saveCfg = () => localStorage.setItem('shorts-cfg', JSON.stringify(cfg));

let items = [];       // { file, src, title, url }
let order = [];       // 재생 순서 (items 인덱스)
let pos = -1;         // order 안에서 지금 위치
let playsLeft = 0;    // 지금 영상을 앞으로 더 재생할 횟수 (지금 것 포함)
let selected = 0;     // 목록에서 고른 영상
let wakeLock = null;

// "출처_제목 [id].mp4" 형식에서 출처와 제목을 꺼냄
function parseName(name) {
  const base = name.replace(/\.[^.]+$/, '');
  const m = base.match(/^([^_]+)_(.*?)\s*\[[^\]]+\]$/);
  if (!m) return { src: '기타', title: base };
  const s = m[1].toLowerCase();
  const src = s === 'tiktok' ? 'TikTok' : s === 'youtube' ? 'YouTube' : m[1];
  return { src, title: m[2].trim() };
}

const formatCount = () => cfg.count === 0 ? '∞' : String(cfg.count);
const setStatus = t => $('status').textContent = t;

function renderSettings() {
  $('countVal').textContent = formatCount();
  $('tglShuffle').classList.toggle('on', cfg.shuffle);
  $('tglLoopAll').classList.toggle('on', cfg.loopAll);
  $('vol').value = cfg.volume;
  $('volVal').textContent = cfg.volume + '%';
  video.volume = cfg.volume / 100;
}

function renderList() {
  const ul = $('list');
  ul.innerHTML = '';
  const playingIdx = pos >= 0 ? order[pos] : -1;
  items.forEach((it, i) => {
    const li = document.createElement('li');
    if (i === playingIdx) li.className = 'playing';
    const badge = document.createElement('span');
    badge.className = 'badge ' + it.src;
    badge.textContent = it.src;
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = it.title;
    li.append(badge, t);
    li.onclick = () => { selected = i; startPlay(i); };
    ul.append(li);
  });
  $('listCount').textContent = items.length + '개';
}

function renderNow() {
  if (pos < 0) { $('nowTitle').textContent = '—'; $('loopInfo').textContent = ''; return; }
  $('nowTitle').textContent = items[order[pos]].title;
  $('loopInfo').textContent = cfg.count === 0 ? '∞ 계속 반복'
    : `${Math.max(1, cfg.count - playsLeft + 1)} / ${cfg.count} 번째`;
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startPlay(start) {
  if (items.length === 0) { setStatus('먼저 [영상 고르기]로 영상을 골라 주세요.'); return; }
  const idx = items.map((_, i) => i);
  if (cfg.shuffle) {
    order = [start, ...shuffled(idx.filter(i => i !== start))];
    pos = 0;
  } else {
    order = idx;
    pos = start;
  }
  playCurrent();
  setStatus('');
  keepAwake();
}

function playCurrent() {
  playsLeft = cfg.count;
  video.src = items[order[pos]].url;
  $('stage').classList.add('playing');
  video.play().catch(() => {});
  renderNow();
  renderList();
}

function next() {
  if (pos < 0) return;
  if (pos + 1 < order.length) { pos++; playCurrent(); return; }
  if (cfg.loopAll) {
    if (cfg.shuffle) order = shuffled(order);
    pos = 0;
    playCurrent();
    return;
  }
  stop();
  $('nowTitle').textContent = '다 봤어요! 다시 보려면 재생';
}

function stop() {
  video.pause();
  video.removeAttribute('src');
  video.load();
  pos = -1;
  $('stage').classList.remove('playing');
  $('btnPlay').textContent = '▶ 재생';
  renderNow();
  renderList();
  releaseAwake();
}

// 한 번 다 보면: 남은 횟수가 있으면 처음부터, 없으면 다음 영상
video.addEventListener('ended', () => {
  if (cfg.count === 0) { video.currentTime = 0; video.play(); return; }
  playsLeft--;
  if (playsLeft > 0) { video.currentTime = 0; video.play(); renderNow(); }
  else next();
});
video.addEventListener('play', () => $('btnPlay').textContent = '❚❚ 일시정지');
video.addEventListener('pause', () => $('btnPlay').textContent = '▶ 재생');
video.addEventListener('click', () => video.paused ? video.play() : video.pause());

// 재생하는 동안 화면이 꺼지지 않게
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseAwake() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && pos >= 0) { wakeLock = null; keepAwake(); }
});

// ---------- 버튼 ----------
$('btnPlay').onclick = () => {
  if (pos < 0) startPlay(selected);
  else if (video.paused) video.play();
  else video.pause();
};
$('btnStop').onclick = () => { if (pos >= 0) { stop(); setStatus('멈췄어요. 다시 보려면 재생'); } };
$('btnNext').onclick = next;

// 1 ... 20 → ∞ 순서
$('btnMinus').onclick = () => {
  if (cfg.count === 0) { cfg.count = MAX_COUNT; playsLeft = MAX_COUNT; }
  else if (cfg.count > 1) { cfg.count--; playsLeft = Math.max(1, playsLeft - 1); }
  saveCfg(); renderSettings(); renderNow();
};
$('btnPlus').onclick = () => {
  if (cfg.count === 0) return;
  cfg.count = cfg.count >= MAX_COUNT ? 0 : cfg.count + 1;
  if (cfg.count > 0) playsLeft++;
  saveCfg(); renderSettings(); renderNow();
};
$('tglShuffle').onclick = () => { cfg.shuffle = !cfg.shuffle; saveCfg(); renderSettings(); };
$('tglLoopAll').onclick = () => { cfg.loopAll = !cfg.loopAll; saveCfg(); renderSettings(); };
$('vol').oninput = e => { cfg.volume = +e.target.value; saveCfg(); renderSettings(); };

$('btnPick').onclick = () => $('picker').click();
$('picker').onchange = e => {
  const files = [...e.target.files];
  if (files.length === 0) return;
  stop();
  items.forEach(it => URL.revokeObjectURL(it.url));
  items = files
    .sort((a, b) => b.lastModified - a.lastModified)
    .map(f => ({ file: f, url: URL.createObjectURL(f), ...parseName(f.name) }));
  selected = 0;
  renderList();
  setStatus(`${items.length}개 골랐어요. 영상을 누르거나 재생을 누르면 시작해요.`);
  e.target.value = '';
};

renderSettings();
renderList();
</script>
</body>
</html>
