name: 안드로이드 앱 만들기

on:
  push:
    paths:
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 웹 화면(index.html)을 앱에 넣기
        run: |
          npm ci
          npm run sync

      - name: APK 만들기
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../shorts-player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-player-apk
          path: shorts-player.apk

      - name: 릴리스에 올리기 (폰에서 받는 곳)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: 쇼츠 플레이어 앱 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: shorts-player.apk
          body: |
            폰에서 아래 **shorts-player.apk**를 눌러 받은 뒤 열어서 설치하세요.
            처음 한 번은 "출처를 알 수 없는 앱 설치"를 허용해야 해요.
